name: Python checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: Python;Python/src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python/requirements-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r Python/requirements-test.txt
      - name: Verify generated portfolio graphic
        run: python Python/examples/portfolio/render_overview.py --check
      - name: Run Python regression tests
        run: python -m unittest discover -s Python/tests -v
